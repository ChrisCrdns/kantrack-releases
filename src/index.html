<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>KanTrack</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <div class="board" id="board">
    <div class="topbar">
      <div class="brand" title="KanTrack">
        <span class="brand-name">Kan<span
            class="brand-accent">Track</span></span>
      </div>

      <div class="search-wrap" role="search">
        <svg class="search-glyph" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.4"></circle>
          <path d="m15.8 15.8 4 4"></path>
        </svg>
        <input type="text" class="search-input" id="search-input"
          placeholder="Search tasks..." />
        <span class="search-shortcut">/</span>
        <span class="search-clear" id="search-clear" title="Clear">✕</span>
      </div>

      <div class="topbar-actions">
        <button class="icon-btn" id="add-lane-btn" title="Add lane" aria-label="Add lane">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14"></path>
            <path d="M5 12h14"></path>
          </svg>
        </button>
        <button class="icon-btn" id="filter-btn" title="Filters" aria-label="Filters">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h7"></path>
            <path d="M15 7h5"></path>
            <circle cx="13" cy="7" r="2"></circle>
            <path d="M4 17h4"></path>
            <path d="M12 17h8"></path>
            <circle cx="10" cy="17" r="2"></circle>
          </svg>
        </button>
        <button class="icon-btn" id="info-btn" title="Shortcuts" aria-label="Shortcuts">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8"></circle>
            <path d="M12 11v5"></path>
            <path d="M12 8h.01"></path>
          </svg>
        </button>
        <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.2a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.6a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.2a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.2a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.6a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.2a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
    </div>

    <div class="filter-strip" id="filter-strip" hidden></div>

    <div class="lanes-wrap">
      <div class="lanes" id="lanes"></div>
    </div>

    <div class="overlay-root" id="overlay-root"></div>
    <div class="toast-root" id="toast-root"></div>

    <div class="update-modal" id="update-modal" hidden>
      <div class="update-card" role="dialog" aria-modal="true" aria-labelledby="update-title">
        <span class="update-mark">◆</span>
        <h2 id="update-title">KanTrack update available</h2>
        <p id="update-message">A newer version is ready to install.</p>
        <div class="update-progress" id="update-progress" hidden>
          <div class="update-progress-bar" id="update-progress-bar"></div>
        </div>
        <div class="update-modal-actions">
          <button type="button" id="update-later">Later</button>
          <button type="button" id="update-now">Update Now</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>

</html>
